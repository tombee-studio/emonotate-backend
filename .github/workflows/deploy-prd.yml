name: Deploy backend to prd

run-name: Deploy backend ${{ github.sha }} to prd

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# Never run two backend deploys to the same environment at once; queue them instead.
concurrency:
  group: deploy-backend-prd
  queue: max

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prd
    secrets:
      aws_role_arn: ${{ secrets.AWS_CI_ROLE_ARN_PRD }}

  release:
    needs: deploy
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
